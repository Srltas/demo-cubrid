# [B안] 서브모듈 bump 수신기 — 판단 로직은 우리가, 배관은 검증된 표준 액션이 담당
#
# 트리거: 서브모듈의 notify-parent.yml 이 보낸 repository_dispatch (또는 수동 실행)
# 흐름:  App/PAT 토큰 → 해당 서브모듈만 update --remote → 제목 생성(이슈번호 상속)
#        → 리뷰어 선정(자기 리뷰 방지) → peter-evans/create-pull-request 로 PR 생성·갱신
#
# 필요 시크릿: PARENT_PAT (checkout + PR 생성용 — PR이 pr-style 체크를 트리거하려면
#              기본 GITHUB_TOKEN 이 아니라 PAT/App 토큰으로 열어야 함)
# 선택 변수:   DEMO_REVIEWER (B안 리뷰어), DEMO_REVIEWER_ALT (리뷰어=push한 사람일 때 대체)
#              ※ 리뷰어는 PR 작성자(PAT 소유자 Srltas)와 달라야 함 → 동료 GitHub ID 권장

name: Submodule bump (receiver)

on:
  repository_dispatch:
    types: [submodule-bump]
  workflow_dispatch:            # 수동 시연용
    inputs:
      submodule_path: { description: "서브모듈 경로", default: "demo-jdbc" }
      commit_message: { description: "원본 커밋 제목(이슈번호 상속 시연)", default: "[DEMO-000] manual test" }
      pusher:         { description: "push한 사람(assignee)", default: "" }

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    env:
      SUB_PATH:   ${{ github.event.client_payload.submodule_path || inputs.submodule_path }}
      COMMIT_MSG: ${{ github.event.client_payload.commit_message || inputs.commit_message }}
      PUSHER:     ${{ github.event.client_payload.pusher || inputs.pusher }}
    steps:
      - name: Checkout parent (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
          token: ${{ secrets.PARENT_PAT }}

      - name: Update submodule pointer (해당 모듈만)
        id: bump
        run: |
          set -euo pipefail
          git submodule update --remote -- "$SUB_PATH"
          if git diff --quiet -- "$SUB_PATH"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "변경 없음 — 서브모듈이 이미 최신 SHA"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "new_sha=$(git -C "$SUB_PATH" rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build PR title (이슈번호 상속 + fallback)
        if: steps.bump.outputs.changed == 'true'
        id: title
        run: |
          set -euo pipefail
          TAG=$(printf '%s' "$COMMIT_MSG" | head -n1 | grep -oE '^\[[A-Z]+-[0-9]+\]' || true)
          [ -z "$TAG" ] && TAG="[DEMO-0]"   # 태그 없는 커밋도 pr-style 통과 보장 (2안 결함 #2/#7 개선)
          echo "value=${TAG} Update ${SUB_PATH} submodule" >> "$GITHUB_OUTPUT"

      - name: Decide reviewer (자기 리뷰 방지)
        if: steps.bump.outputs.changed == 'true'
        id: who
        env:
          MAIN_REVIEWER: ${{ vars.DEMO_REVIEWER }}
          ALT_REVIEWER:  ${{ vars.DEMO_REVIEWER_ALT }}
        run: |
          set -euo pipefail
          REVIEWER="$MAIN_REVIEWER"
          if [ -n "$REVIEWER" ] && [ "$REVIEWER" = "$PUSHER" ]; then
            REVIEWER="$ALT_REVIEWER"       # push한 사람이 리뷰어면 대체 (2안 결함 #1 개선)
          fi
          echo "reviewer=$REVIEWER" >> "$GITHUB_OUTPUT"

      - name: Create or update PR
        if: steps.bump.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7   # 운영 시 최신 major 확인 + 커밋 SHA 로 고정 권장
        with:
          token: ${{ secrets.PARENT_PAT }}
          branch: bump/${{ env.SUB_PATH }}          # 고정 브랜치 → 같은 PR 갱신 (2안 결함 #4 개선)
          base: main
          title: ${{ steps.title.outputs.value }}
          commit-message: ${{ steps.title.outputs.value }}
          body: |
            서브모듈 `${{ env.SUB_PATH }}` 자동 갱신 PR — **B안(자체 구축) 데모**

            - 새 SHA: `${{ steps.bump.outputs.new_sha }}`
            - 원본 커밋: `${{ env.COMMIT_MSG }}`
            - push: @${{ env.PUSHER }}

            > 흐름: repository_dispatch 수신 → `git submodule update --remote` → peter-evans/create-pull-request
          labels: Submodule Auto Update
          assignees: ${{ env.PUSHER }}
          reviewers: ${{ steps.who.outputs.reviewer }}
          delete-branch: true
